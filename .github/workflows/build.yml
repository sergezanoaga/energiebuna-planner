name: Build Energie Bună Planner

# Собирает образ: Postiz версии UPSTREAM + rebrand.py, кладёт в ghcr.io/sergezanoaga/energiebuna-planner:<UPSTREAM>-<REV>.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          . ./VERSION
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "tag=$UPSTREAM-$REV" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Postiz source
        run: git clone --depth 1 --branch "${{ steps.v.outputs.upstream }}" https://github.com/gitroomhq/postiz-app.git src

      - name: Rebrand
        run: python3 rebrand.py src

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          IMG=ghcr.io/sergezanoaga/energiebuna-planner:${{ steps.v.outputs.tag }}
          docker buildx build --platform linux/amd64 \
            -f src/Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ steps.v.outputs.upstream }} \
            --label org.opencontainers.image.source=https://github.com/sergezanoaga/energiebuna-planner \
            --label org.opencontainers.image.licenses=AGPL-3.0 \
            --provenance=false --sbom=false \
            -t "$IMG" --push src
          echo "образ: $IMG" >> "$GITHUB_STEP_SUMMARY"
